name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "apps/frclog/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/frclog/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frclog

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/frclog/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

  tauri:
    name: Tauri Rust Checks
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/frclog/src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path apps/frclog/src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/frclog/src-tauri/Cargo.toml --locked --all-targets -- -D warnings